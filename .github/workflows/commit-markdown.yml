name: Commit Markdown from Neurons

on:
 workflow_dispatch:
   inputs:
     filename:
       description: 'Name of the markdown file (e.g. system-xyz.md)'
       required: true
       type: string
     content:
       description: 'The markdown content to commit'
       required: true
       type: string

permissions:
 contents: write

jobs:
 commit-file:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout repo
       uses: actions/checkout@v5

     - name: Write markdown file
       run: |
         mkdir -p Documentation
         echo "${{ github.event.inputs.content }}" > "Documentation/${{ github.event.inputs.filename }}"

     - name: Commit and push
       run: |
         git config user.name "neurons-bot"
         git config user.email "neurons-bot@users.noreply.github.com"
         git add "Documentation/${{ github.event.inputs.filename }}"
         git commit -m "Add Documentation/${{ github.event.inputs.filename }}"
         git push
